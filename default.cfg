; SkySeeker configuration defaults. Every option the software reads is listed
; here with its accepted values. A rig overrides options in
; /home/radxa/tricap/initial.cfg; anything missing there falls back to this
; file. Restart the service to apply a change: sudo systemctl restart tricap

[Camera]
sony_image_format = Default        ; Default | RAW | JPEG. Default leaves the camera body's setting untouched

[Misc]
image_capture_interval = 3         ; float >= 0.5. Seconds between triggers; also set from the Setup page

[Ui]
status_poll_ms = 1000              ; int >= 250.  Home page status refresh
sensors_poll_ms = 2000             ; int >= 250.  Setup page sensor refresh while idle
sensors_poll_capturing_ms = 5000   ; int >= 250.  Setup page sensor refresh while capturing
background_poll_ms = 15000         ; int >= 1000. Storage, statistics and image-format refresh (paused while capturing)
uplink_poll_ms = 10000             ; int >= 1000. Setup page Wi-Fi uplink status (paused while capturing)
netbird_poll_ms = 20000            ; int >= 1000. Setup page NetBird status (paused while capturing)
backup_poll_ms = 2000              ; int >= 250.  Backup progress while a copy runs
verify_poll_ms = 1000              ; int >= 250.  Verify/delete progress while it runs
heartbeat_ms = 5000                ; int >= 1000. Connection-lost banner ping cadence
