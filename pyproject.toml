[project]
name = "skyseeker"
version = "0.1.0"
description = "SkySeeker aerial capture controller"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Flask==3.1.3",
    "Pillow==12.3.0",
    "RPi.GPIO==0.7.1; sys_platform == 'linux'",
    "ntplib==0.4.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "pyserial==3.5",
    "pytz==2026.3.post1",
    "pyubx2==1.3.6",
    "requests==2.34.2",
]

[tool.uv]
package = false
