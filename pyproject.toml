[project]
name = "skyseeker"
version = "0.1.0"
description = "SkySeeker aerial capture controller"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Flask==3.1.3",
    "pyserial==3.5",
    "pyubx2==1.3.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["node_modules", "app/static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
