requires-python = ">=3.10,<3.13"
dependencies = [
    "Flask==3.1.3",
    "Flask-WTF==1.3.0",
    "Pillow==12.3.0",
    "PyExifTool==0.5.6",
    "RPi.GPIO==0.7.1; sys_platform == 'linux'",
    "WTForms==3.2.2",
    "anytree==2.13.0",
    "imageio==2.37.4",
    "netifaces==0.11.0",
    "ntplib==0.4.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "protobuf==6.32.0",
    "pyserial==3.5",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "pyubx2==1.3.6",
    "rawpy==0.27.1",
    "requests==2.34.2",
    "scipy==1.15.3",
    "smbus==1.1.post2; sys_platform == 'linux'",
]

[tool.uv]
package = false
