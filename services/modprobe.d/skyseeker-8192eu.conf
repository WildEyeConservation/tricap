# Disable every power-management feature of the out-of-tree rtl8192eu driver
# that runs the SkySeeker AP dongle (TP-Link 2357:0108, RTL8192EU).
#
# Power-state transitions in this driver are a known kernel-lockup trigger,
# and our failures correlate with weak-signal clients (heavy retransmit +
# power-save churn). An AP that must beacon continuously gains nothing from
# any of these features.
#
#   rtw_ips_mode=0    inactive power save (RF down/up on idle) - was enabled
#   rtw_power_mgnt=0  leisure power save - matches current value, pinned
#   rtw_enusbss=0     USB selective suspend - matches current value, pinned
options 8192eu rtw_ips_mode=0 rtw_power_mgnt=0 rtw_enusbss=0
