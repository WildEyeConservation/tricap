# Force the ADATA SD810 enclosure (090c:a38a) to use USB bulk-only
# transport instead of UAS.  On the SkySeeker USB topology, queued UAS
# writes have coincided with a complete hub reset and lost write commands.
# Bulk-only transport is slower but uses a single, simpler command stream.
options usb-storage quirks=090c:a38a:u
